name: Deploy relay

# Runs on GitHub's Linux machines (not the Mac ones).
# Tap "Run workflow" on the Actions tab, or it runs by itself when relay code changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/deploy-relay.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.RELAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the relay
        working-directory: relay
        run: node test/hub.test.mjs

      - name: Skip deploy until secrets are added
        if: env.HAS_SECRETS != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and RELAY_TOKEN under Settings > Secrets and variables > Actions, then run this again."

      - name: Deploy to Cloudflare
        if: env.HAS_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          secrets: |
            RELAY_TOKEN
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
