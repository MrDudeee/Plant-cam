name: Deploy relay

# Runs on GitHub's Linux machines (not the Mac ones).
# Tap "Run workflow" on the Actions tab, or it runs by itself when relay code changes.
# Saves the result to the build-logs branch (relay.txt).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/deploy-relay.yml"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.RELAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the relay
        id: test
        working-directory: relay
        run: |
          set -o pipefail
          node test/hub.test.mjs 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Skip deploy until secrets are added
        if: env.HAS_SECRETS != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and RELAY_TOKEN under Settings > Secrets and variables > Actions, then run this again."

      - name: Deploy to Cloudflare
        id: deploy
        if: env.HAS_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          secrets: |
            RELAY_TOKEN
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}

      - name: Save the result to the build-logs branch
        if: always()
        run: |
          {
            echo "workflow: deploy-relay"
            echo "commit: $GITHUB_SHA"
            echo "test: ${{ steps.test.outcome }}"
            echo "deploy: ${{ steps.deploy.outcome }}"
            echo "--- relay test output ---"
            cat "$RUNNER_TEMP/test.log" 2>/dev/null || true
          } > "$RUNNER_TEMP/relay.txt"
          cp .github/scripts/save-log.sh "$RUNNER_TEMP/save-log.sh"
          bash "$RUNNER_TEMP/save-log.sh" "$RUNNER_TEMP/relay.txt" relay.txt "deploy-relay result for $GITHUB_SHA"
