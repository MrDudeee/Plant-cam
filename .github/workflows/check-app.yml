name: Check app

# Compiles the app without signing, so mistakes show up before any real build.
# Needs no Apple keys. Saves the result to the build-logs branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/check-app.yml"]

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Draw the app icon
        run: python3 app/scripts/make_icon.py app/PlantCam/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Generate the Xcode project
        id: generate
        working-directory: app
        run: |
          set -o pipefail
          { brew install xcodegen && xcodegen generate; } 2>&1 | tee "$RUNNER_TEMP/generate.log"

      - name: Compile without signing
        id: compile
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build \
            -project PlantCam.xcodeproj \
            -scheme PlantCam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show what ended up in the built app's settings file
        if: steps.compile.outcome == 'success'
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name PlantCam.app -path "*Release-iphoneos*" | head -1)
          echo "app: $APP" > "$RUNNER_TEMP/plist.log"
          plutil -p "$APP/Info.plist" 2>&1 | grep -E "UIBackgroundModes|NSPhotoLibraryUsageDescription|NSCameraUsageDescription|CFBundleDisplayName|=> \"audio\"" >> "$RUNNER_TEMP/plist.log" || echo "no matching entries" >> "$RUNNER_TEMP/plist.log"

      - name: Save the result to the build-logs branch
        if: always()
        run: |
          {
            echo "workflow: check-app"
            echo "commit: $GITHUB_SHA"
            echo "generate: ${{ steps.generate.outcome }}"
            echo "compile: ${{ steps.compile.outcome }}"
            echo "xcode: $(xcodebuild -version | head -1)"
            echo "--- built app settings ---"
            cat "$RUNNER_TEMP/plist.log" 2>/dev/null || true
            echo "--- errors and warnings ---"
            grep -E "error:|warning:" "$RUNNER_TEMP/build.log" 2>/dev/null | sort -u | head -150 || true
            echo "--- end of compile ---"
            tail -25 "$RUNNER_TEMP/build.log" 2>/dev/null || true
          } > "$RUNNER_TEMP/check.txt"
          cp .github/scripts/save-log.sh "$RUNNER_TEMP/save-log.sh"
          bash "$RUNNER_TEMP/save-log.sh" "$RUNNER_TEMP/check.txt" check.txt "check-app result for $GITHUB_SHA"
