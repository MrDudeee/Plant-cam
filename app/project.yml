name: PlantCam
options:
  bundleIdPrefix: com.mrdudeee
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  PlantCam:
    type: application
    platform: iOS
    sources:
      - PlantCam
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrdudeee.plantcam
        PRODUCT_NAME: PlantCam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plant Cam
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Plant Cam shares your plant photos with Claude while the app is open, and files them into albums for your timelapses."
        CODE_SIGN_STYLE: Automatic
